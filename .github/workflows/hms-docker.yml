name: HMS Docker Image

on:
  push:
    branches: [main, repair/hms-additive]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hms-docker-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Rust and database compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact upstream database fixture
        run: |
          git fetch --depth=1 https://github.com/AldenClark/pushgo-gateway.git a84a937ccc7cbcce99c5a0e37f35ed2d0fe55906
          test "$(git rev-parse FETCH_HEAD)" = a84a937ccc7cbcce99c5a0e37f35ed2d0fe55906
          if ! git rev-parse 'v1.3.0-beta.1^{commit}' >/dev/null 2>&1; then git tag v1.3.0-beta.1 FETCH_HEAD; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install database tools
        run: sudo apt-get update -qq && sudo apt-get install -y sqlite3 jq
      - name: Capture Action formatter changes
        run: |
          mkdir -p evidence
          cargo fmt --all
          git diff --output=evidence/rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-formatter
          path: evidence/rustfmt.patch
      - name: Strict lint and all protocol tests
        env:
          PUSHGO_REQUIRE_EXTERNAL_DB_TESTS: '1'
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: SQLite MySQL PostgreSQL compatibility
        env:
          ROUNDS: '3'
          REPORT_DIR: evidence/action-crossdb
        run: bash scripts/storage_crossdb_parity.sh
      - name: Require formatted source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-verification
          path: evidence/
  build:
    needs: verify
    name: Build and verify ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.local
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PushGo Gateway HMS
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=hms-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=hms-${{ matrix.arch }}
          provenance: false
      - name: Verify binary and gateway startup
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          docker pull "$ref"
          docker run --rm "$ref" --version | grep -F 'pushgo-gateway 1.3.2'
          docker run -d --name hms-smoke -p 127.0.0.1:16666:6666 \
            -e PUSHGO_TOKEN=ci-smoke -e PUSHGO_PRIVATE_TRANSPORTS=false \
            -e PUSHGO_MCP_ENABLED=false -e PUSHGO_OBSERVABILITY_LOG_LEVEL=info "$ref"
          trap 'docker logs --tail 40 hms-smoke; docker rm -f hms-smoke >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Authorization: Bearer ci-smoke' \
              http://127.0.0.1:16666/readyz > /tmp/ready.json; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
          jq -e '.success == true and .data.status == "ok"' /tmp/ready.json
          curl --fail --silent -H 'Authorization: Bearer ci-smoke' \
            http://127.0.0.1:16666/healthz | jq -e '.success == true and .data.status == "ok"'
          status=$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:16666/healthz)
          test "$status" = 401
          python3 scripts/metadata_limit_smoke.py http://127.0.0.1:16666 512
          docker run -d --name metadata-smoke -p 127.0.0.1:16667:6666 \
            -e PUSHGO_TOKEN=ci-smoke -e PUSHGO_PRIVATE_TRANSPORTS=false \
            -e PUSHGO_MCP_ENABLED=false -e PUSHGO_METADATA_MAX_VALUE_BYTES=8192 "$ref"
          trap 'docker logs --tail 40 hms-smoke; docker logs --tail 40 metadata-smoke; docker rm -f hms-smoke metadata-smoke >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Authorization: Bearer ci-smoke' \
              http://127.0.0.1:16667/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
          python3 scripts/metadata_limit_smoke.py http://127.0.0.1:16667 8192
          if docker run --rm -e PUSHGO_METADATA_MAX_VALUE_BYTES=0 "$ref" >/tmp/invalid-metadata-limit.log 2>&1; then
            cat /tmp/invalid-metadata-limit.log
            exit 1
          fi
          grep -F 'metadata-max-value-bytes' /tmp/invalid-metadata-limit.log
          mkdir -p digests
          jq -n --arg digest "$DIGEST" --arg platform '${{ matrix.platform }}' \
            --arg revision "$GITHUB_SHA" '{digest:$digest,platform:$platform,revision:$revision,smoke:"passed"}' \
            > 'digests/${{ matrix.arch }}.json'
      - name: Upload verified digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hms-image-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout deployment templates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hms-image-*
          merge-multiple: true
          path: digests
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest and immutable revision tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          jq -e -s --arg revision "$GITHUB_SHA" \
            'length == 2 and all(.[]; .revision == $revision and .smoke == "passed" and (.digest | test("^sha256:[0-9a-f]{64}$"))) and ([.[].platform] | sort == ["linux/amd64","linux/arm64"])' \
            digests/*.json >/dev/null
          refs=()
          for file in digests/*.json; do refs+=("${image}@$(jq -r .digest "$file")"); done
          tags=(--tag "${image}:sha-${GITHUB_SHA}")
          if [ "$GITHUB_REF_NAME" = main ]; then tags+=(--tag "${image}:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --raw > manifest.json
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}' > image-digest.txt
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64","linux/arm64"]' manifest.json
          {
            echo '## HMS Gateway image'
            echo "Image: \`${image}:latest\`"
            echo "Revision: \`${GITHUB_SHA}\`"
            echo 'Platforms: linux/amd64, linux/arm64; both startup checks passed.'
            echo "\`docker pull ${image}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish gateway deployment download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="hms-build-$GITHUB_RUN_NUMBER"
          mkdir -p dist-release/pushgo-gateway-hms
          cp deploy/hms/compose.yaml deploy/hms/.env.example deploy/hms/README.md LICENSE dist-release/pushgo-gateway-hms/
          cp HMS-PUSH.md dist-release/pushgo-gateway-hms/
          sed -i "s|^PUSHGO_IMAGE=.*|PUSHGO_IMAGE=$image:sha-$GITHUB_SHA|" dist-release/pushgo-gateway-hms/.env.example
          cp manifest.json dist-release/
          cp image-digest.txt dist-release/
          printf 'commit=%s\nimage=%s:sha-%s\nplatforms=linux/amd64,linux/arm64\n' \
            "$GITHUB_SHA" "$image" "$GITHUB_SHA" > dist-release/BUILD_INFO.txt
          tar -czf dist-release/pushgo-gateway-hms-deploy.tar.gz -C dist-release pushgo-gateway-hms
          rm -r dist-release/pushgo-gateway-hms
          (cd dist-release && sha256sum ./* > SHA256SUMS.txt)
          printf '%s\n' \
            '官方 PushGo Gateway 的 HMS 二开镜像和通用部署模板。' \
            "Docker: $image:latest (linux/amd64, linux/arm64)" \
            '两个架构均通过启动检查，密钥和数据库不包含在部署包或镜像中。' \
            "Source: $GITHUB_SHA" > release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq .targetCommitish > existing-release.txt; then
            test "$(cat existing-release.txt)" = "$GITHUB_SHA"
          else
            gh release create "$tag" dist-release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "PushGo HMS gateway build $GITHUB_RUN_NUMBER" \
              --notes-file release-notes.md
          fi
